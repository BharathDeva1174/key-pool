<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>KeyPool</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0c'/%3E%3Cpath d='M9 21V11m0 0 4.5 5m-4.5-5 4.5-5M19 21V11l-4 5 4 5' stroke='%234cc9f0' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Resolve the theme before first paint. Without this the page renders in
      // the default scheme and then snaps, which is exactly the flash a
      // wall-display dashboard cannot afford.
      (function () {
        try {
          var stored = localStorage.getItem('keypool.theme');
          // 'auto' and the legacy 'system' both mean "no opinion" - fall
          // through to the media query. Must stay in step with readStored()
          // in web/src/lib/theme.ts.
          var pinned = stored === 'light' || stored === 'dark';
          var dark = pinned
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* private mode: fall through to the stylesheet default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
